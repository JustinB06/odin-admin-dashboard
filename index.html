<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- TODO: Do I need to wrap the <img> elements in <a> elements
      to make them clickable? -->
    <nav id="sidebar">
      <ol id="sidebar-header">
        <li class="sidebar-item">
          <img id="sidebar-header-logo" alt="placeholder-image-dashboard" />
          <a id="sidebar-header-text" class="sidebar-item-text" href=""
            >Dashboard</a
          >
        </li>
      </ol>

      <ol id="sidebar-general-links">
        <li class="sidebar-item">
          <img alt="placeholder-image-home" />
          <a class="sidebar-item-text" href="">Home</a>
        </li>
        <li class="sidebar-item">
          <img alt="placeholder-image-profile" />
          <a class="sidebar-item-text" href="">Profile</a>
        </li>
        <li class="sidebar-item">
          <img alt="placeholder-image-messages" />
          <a class="sidebar-item-text" href="">Messages</a>
        </li>
        <li class="sidebar-item">
          <img alt="placeholder-image-history" />
          <a class="sidebar-item-text" href="">History</a>
        </li>
        <li class="sidebar-item">
          <img alt="placeholder-image-tasks" />
          <a class="sidebar-item-text" href="">Tasks</a>
        </li>
        <li class="sidebar-item">
          <img alt="placeholder-image-communities" />
          <a class="sidebar-item-text" href="">Communities</a>
        </li>
      </ol>

      <ol id="sidebar-settings-links">
        <li class="sidebar-item">
          <img src="" alt="placeholder-image-settings" />
          <a class="sidebar-item-text" href="">Settings</a>
        </li>
        <li class="sidebar-item">
          <img src="" alt="placeholder-image-support" />
          <a class="sidebar-item-text" href="">Support</a>
        </li>
        <li class="sidebar-item">
          <img src="" alt="placeholder-image-privacy" />
          <a class="sidebar-item-text" href="">Privacy</a>
        </li>
      </ol>
    </nav>
  </body>
</html>
