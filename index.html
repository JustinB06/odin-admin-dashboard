<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav id="sidebar">
      <ol id="sidebar-header">
        <li class="sidebar-item">
          <img id="sidebar-header-logo" alt="placeholder-image-dashboard" />
          <h1 id="sidebar-header-text">Dashboard</h1>
        </li>
      </ol>

      <ol id="sidebar-general-links">
        <li class="sidebar-item">
          <img alt="placeholder-image-home" />
          <h3 class="sidebar-item-text">Home</h3>
        </li>
        <li class="sidebar-item">
          <img alt="placeholder-image-profile" />
          <h3 class="sidebar-item-text">Profile</h3>
        </li>
        <li class="sidebar-item">
          <img alt="placeholder-image-messages" />
          <h3 class="sidebar-item-text">Messages</h3>
        </li>
        <li class="sidebar-item">
          <img alt="placeholder-image-history" />
          <h3 class="sidebar-item-text">History</h3>
        </li>
        <li class="sidebar-item">
          <img alt="placeholder-image-tasks" />
          <h3 class="sidebar-item-text">Tasks</h3>
        </li>
        <li class="sidebar-item">
          <img alt="placeholder-image-communities" />
          <h3 class="sidebar-item-text">Communities</h3>
        </li>
      </ol>

      <ol id="sidebar-settings-links">
        <li class="sidebar-item">
          <img src="" alt="placeholder-image-settings" />
          <h3 class="sidebar-item-text">Settings</h3>
        </li>
        <li class="sidebar-item">
          <img src="" alt="placeholder-image-support" />
          <h3 class="sidebar-item-text">Support</h3>
        </li>
        <li class="sidebar-item">
          <img src="" alt="placeholder-image-privacy" />
          <h3 class="sidebar-item-text">Privacy</h3>
        </li>
      </ol>
    </nav>
  </body>
</html>
